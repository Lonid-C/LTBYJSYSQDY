<title>第四问 波动电价建模</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#FBFBFC; --panel:#F2F4F8; --panel2:#E9EDF3;
  --ink:#171C26; --body:#28303D; --slate:#5C6678; --faint:#8A93A3;
  --rule:#DDE2E9; --rule2:#C8D0DC;
  --accent:#2F5D9E; --accent-soft:#E4ECF7; --warn:#B5502F; --warn-soft:#F7E9E3;
  --good:#2F6B4F;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --measure:44rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#10141C; --panel:#181E28; --panel2:#212936;
    --ink:#E7EBF2; --body:#C9D1DD; --slate:#97A1B2; --faint:#6F798A;
    --rule:#28313F; --rule2:#3A4556;
    --accent:#7FA9DF; --accent-soft:#1B2738; --warn:#DD8A6C; --warn-soft:#2E2119;
    --good:#6FAE8C;
  }
}
:root[data-theme="dark"]{
  --ground:#10141C; --panel:#181E28; --panel2:#212936;
  --ink:#E7EBF2; --body:#C9D1DD; --slate:#97A1B2; --faint:#6F798A;
  --rule:#28313F; --rule2:#3A4556;
  --accent:#7FA9DF; --accent-soft:#1B2738; --warn:#DD8A6C; --warn-soft:#2E2119;
  --good:#6FAE8C;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--body);font-family:var(--serif);
  font-size:16px;line-height:1.85;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;padding-block:0 72px}

/* ---------- 抬头 ---------- */
header.top{border-bottom:1px solid var(--rule);margin-bottom:0}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin:44px 0 10px}
h1.doc{font-family:var(--sans);font-weight:700;font-size:clamp(1.7rem,4.4vw,2.5rem);
  line-height:1.25;color:var(--ink);margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.sub{font-size:1rem;color:var(--slate);max-width:var(--measure);margin:0 0 26px}
.handoff{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);
  border-left:3px solid var(--accent);padding:14px 18px;margin:0 0 28px;max-width:var(--measure);
  font-family:var(--sans);font-size:.9rem;line-height:1.7;color:var(--body);border-radius:0 4px 4px 0}
.handoff b{color:var(--ink)}

/* ---------- 口径条：本文全部数字的前提 ---------- */
.conv{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:0;margin-bottom:0}
.conv div{padding:13px 16px 14px;border-right:1px solid var(--rule)}
.conv div:last-child{border-right:0}
.conv dt{font-family:var(--sans);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:0 0 4px;font-weight:700}
.conv dd{margin:0;font-family:var(--mono);font-size:.82rem;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.5}

/* ---------- 布局 ---------- */
.cols{display:grid;grid-template-columns:232px minmax(0,1fr);gap:52px;align-items:start;margin-top:40px}
nav.toc{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;
  font-family:var(--sans);font-size:.83rem;line-height:1.55;padding-right:8px}
nav.toc .tl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:700;padding:0 0 10px;border-bottom:1px solid var(--rule);margin-bottom:10px}
nav.toc a{display:block;color:var(--slate);text-decoration:none;padding:4px 0 4px 10px;
  border-left:2px solid transparent}
nav.toc a:hover{color:var(--accent);border-left-color:var(--rule2)}
nav.toc a.t2{font-weight:700;color:var(--ink);margin-top:9px}
nav.toc a.t3{padding-left:20px;font-size:.79rem}
nav.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
main{min-width:0;max-width:var(--measure)}

/* ---------- 正文排版 ---------- */
main h1,main h2,main h3,main h4{font-family:var(--sans);color:var(--ink);text-wrap:balance;
  line-height:1.35;position:relative}
main h1{font-size:1.62rem;font-weight:700;margin:56px 0 18px;padding-bottom:11px;border-bottom:2px solid var(--ink)}
main h2{font-size:1.28rem;font-weight:700;margin:48px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
main h3{font-size:1.05rem;font-weight:700;margin:34px 0 10px;color:var(--accent)}
main h4{font-size:.95rem;font-weight:700;margin:24px 0 8px;color:var(--slate)}
.hlink{position:absolute;left:-1.05em;color:var(--rule2);text-decoration:none;font-weight:400;
  opacity:0;transition:opacity .12s}
h1:hover .hlink,h2:hover .hlink,h3:hover .hlink,h4:hover .hlink{opacity:1}
main p{margin:0 0 1.15em}
main strong{color:var(--ink);font-weight:600}
main ul,main ol{margin:0 0 1.2em;padding-left:1.35em}
main li{margin-bottom:.45em}
main li::marker{color:var(--accent)}
main a{color:var(--accent)}
main code{font-family:var(--mono);font-size:.85em;background:var(--panel);
  padding:.1em .38em;border-radius:3px;color:var(--ink);border:1px solid var(--rule)}
main pre{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  padding:14px 16px;overflow-x:auto;font-size:.85rem;line-height:1.6}
main pre code{background:none;border:0;padding:0}
blockquote{margin:1.4em 0;padding:2px 0 2px 18px;border-left:3px solid var(--rule2);
  color:var(--slate);font-style:normal}

/* ---------- 表 ---------- */
.tw{overflow-x:auto;margin:1.5em 0;border:1px solid var(--rule);border-radius:4px;
  max-width:min(100%,54rem)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:.855rem;
  font-variant-numeric:tabular-nums;background:var(--ground)}
th{background:var(--panel2);color:var(--ink);font-weight:700;text-align:left;
  padding:10px 13px;border-bottom:1px solid var(--rule2);white-space:nowrap;font-size:.8rem}
td{padding:9px 13px;border-bottom:1px solid var(--rule);color:var(--body);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel)}
td:not(:first-child),th:not(:first-child){text-align:right}
th:first-child,td:first-child{white-space:nowrap}

/* ---------- 图 ---------- */
.fig{margin:2.1em 0;max-width:min(100%,54rem)}
.fig img{width:100%;max-width:100%;display:block;border:1px solid var(--rule);
  border-radius:4px;background:#fff}
.fig figcaption{font-family:var(--sans);font-size:.81rem;color:var(--slate);
  margin-top:9px;line-height:1.6;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.fig-n{font-weight:700;color:var(--ink);white-space:nowrap}
.fig-src{margin-left:auto;color:var(--accent);text-decoration:none;font-size:.76rem;white-space:nowrap}
.fig-src:hover{text-decoration:underline}
.fig-missing{font-family:var(--mono);font-size:.8rem;color:var(--warn);
  background:var(--warn-soft);padding:10px 14px;border-radius:4px;margin:1.6em 0}

/* ---------- 数学 ---------- */
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:6px 0;margin:1.3em 0!important}

/* ---------- 页脚 ---------- */
footer{margin-top:64px;padding-top:26px;border-top:1px solid var(--rule);
  font-family:var(--sans);font-size:.83rem;color:var(--slate);max-width:var(--measure)}
footer h4{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);font-weight:700;margin:0 0 10px}
footer ul{columns:2;column-gap:26px;padding-left:1.1em;margin:0 0 20px}
footer li{margin-bottom:3px;font-size:.79rem}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.vid{font-family:var(--mono);font-size:.78rem;color:var(--ink);background:var(--panel);
  padding:.15em .45em;border-radius:3px;border:1px solid var(--rule)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .cols{grid-template-columns:1fr;gap:0}
  nav.toc{position:static;max-height:none;border:1px solid var(--rule);border-radius:4px;
    padding:14px 16px;margin-bottom:32px;max-height:280px;overflow-y:auto}
  main{max-width:100%}
  .hlink{display:none}
  footer ul{columns:1}
}
</style>
